<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday!</title>

  <!-- Google Font for the heading -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="card">
    <img
      class="card__image"
      src="./cake.jpg"
      alt="Chocolate drip birthday cake with a gold Happy Birthday topper">

    <section class="card__message">
      <h1 class="card__title">Happy Birthday !!</h1>
      <p class="card__text">
        May your birthday bring a lot of smiles to your face,
        happiness to your heart, and many blessings to your whole life 💌
      </p>
      <footer class="card__footer">
        Made with ❤️ by Afia Furqan
      </footer>
    </section>
  </main>
</body>
</html>
